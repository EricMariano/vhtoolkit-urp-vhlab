services:
  piper:
    build: .
    image: vhlab-piper-tts
    container_name: vhlab-piper
    restart: unless-stopped
    ports:
      - "127.0.0.1:9003:9002"
    environment:
      DEFAULT_VOICE: pt_BR-faber-medium
      SUPPORTED_VOICES: pt_BR-faber-medium
    volumes:
      - piper_cache:/root/.local/share/piper
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  piper_cache:
